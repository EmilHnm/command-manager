<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="swallow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191b22"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="purple-wing-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4b5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#744791"/>
    </linearGradient>
    <linearGradient id="purple-wing-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4d9ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#5f3977"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Chamfer / Squircle -->
  <rect width="128" height="128" rx="28" fill="#141721" stroke="#242a3e" stroke-width="2.5"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#swallow-bg)"/>

  <!-- Subtle Precision Grid Crosses -->
  <circle cx="24" cy="24" r="1.5" fill="#242a3e"/>
  <circle cx="104" cy="24" r="1.5" fill="#242a3e"/>
  <circle cx="24" cy="104" r="1.5" fill="#242a3e"/>
  <circle cx="104" cy="104" r="1.5" fill="#242a3e"/>

  <!-- Swallowtail Butterfly Silhouette - Engineered / Cyberpunk Minimalist -->
  <g transform="translate(0, 2)">
    <!-- Central Thorax & Antennae (Terminal Prompt Axis) -->
    <!-- Antennae / Terminal Pointers -->
    <path d="M60 38 Q52 26 44 24" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="43" cy="23.5" r="2" fill="#e4b5ff"/>
    <path d="M68 38 Q76 26 84 24" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="85" cy="23.5" r="2" fill="#e4b5ff"/>

    <!-- Left Forewing (Geometric Chevron Style > shape) -->
    <path d="M62 44 L30 29 C25 27 22 32 25 37 L46 66 L62 58 Z" 
          fill="url(#purple-wing-left)" opacity="0.95"/>
    <!-- Left Forewing Inner Accent Cutout -->
    <path d="M33 34 L48 56 L58 52 Z" fill="#111319" opacity="0.4"/>

    <!-- Right Forewing (Mirrored Geometric Prompt) -->
    <path d="M66 44 L98 29 C103 27 106 32 103 37 L82 66 L66 58 Z" 
          fill="url(#purple-wing-right)" opacity="0.95"/>
    <!-- Right Forewing Inner Accent Cutout -->
    <path d="M95 34 L80 56 L70 52 Z" fill="#111319" opacity="0.4"/>

    <!-- Left Hindwing with Signature Swallowtail Streamer (Đuôi én phượng) -->
    <path d="M61 63 L44 71 L36 86 C34 90 38 93 42 90 L52 82 L42 104 C40.5 107.5 45.5 109.5 48 106 L61 80 Z" 
          fill="url(#purple-wing-left)"/>
    <!-- Left Emerald Cyber Eye/Dot -->
    <circle cx="48" cy="81" r="3" fill="url(#cyan-accent)" filter="url(#neon-glow)"/>

    <!-- Right Hindwing with Signature Swallowtail Streamer -->
    <path d="M67 63 L84 71 L92 86 C94 90 90 93 86 90 L76 82 L86 104 C87.5 107.5 82.5 109.5 80 106 L67 80 Z" 
          fill="url(#purple-wing-right)"/>
    <!-- Right Emerald Cyber Eye/Dot -->
    <circle cx="80" cy="81" r="3" fill="url(#cyan-accent)" filter="url(#neon-glow)"/>

    <!-- Center Body / Cursor Node -->
    <path d="M64 42 L67 56 L67 76 L64 82 L61 76 L61 56 Z" fill="#ffffff" opacity="0.9"/>
    <line x1="64" y1="46" x2="64" y2="76" stroke="#111319" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Subtle Terminal Prompt Dash / Cursor beneath -->
    <rect x="58" y="93" width="12" height="3" rx="1.5" fill="#4edea3" filter="url(#neon-glow)"/>
  </g>
</svg>
